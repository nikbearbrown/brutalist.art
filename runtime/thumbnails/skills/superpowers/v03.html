<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../lib/base.css">
<title>v03 — terminal-window hero</title>
<style>
  /* V03 · The CLI window IS the subject. */
  .kick{position:absolute;left:140px;top:66px;
    font-family:var(--mono);font-size:20px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft)}
  .kick .slash{color:var(--spark)}
  .win{position:absolute;left:140px;top:132px;width:1000px;height:452px}
  .win-bar{padding:16px 22px}
  .win-title{font-size:16px}
  .win-body{padding:34px 40px;font-size:31px;line-height:1.85}
</style></head>
<body><div class="frame grid-bg">
  <div class="kick"><span class="slash">// </span>claude code · skills</div>
  <div class="win">
    <div class="win-bar"><span class="dot3 r"></span><span class="dot3 y"></span><span class="dot3 g"></span><span class="win-title">superpowers — claude</span></div>
    <div class="win-body">
      <div><span class="p">$</span> <span class="k">claude</span> <span class="c">--skill superpowers</span></div>
      <div><span class="p">›</span> <span class="k">loaded:</span> <span class="accent">superpowers</span></div>
      <div><span class="c">// claude just learned a new trick</span></div>
      <div><span class="p">›</span> <span class="k">what should i build?</span><span class="cursor"></span></div>
    </div>
  </div>
  <div class="wordmark" style="left:140px">brutalist<span class="dot">.</span>art</div>
</div></body></html>
