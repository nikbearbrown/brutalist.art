<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../lib/base.css">
<title>v04 — SKILL.md file snippet + word</title>
<style>
  /* V04 · The skill file as hero: front-matter card left, serif word right. */
  .win{position:absolute;left:90px;top:150px;width:720px;height:436px}
  .win-body{padding:30px 34px;font-size:26px;line-height:1.78}
  .win-body .key{color:var(--ink-soft)}
  .win-body .fm{color:var(--comment)}
  .tab{position:absolute;left:114px;top:112px;
    font-family:var(--mono);font-size:18px;color:var(--ink-soft)}
  .tab .dot{color:var(--spark)}
  .word{position:absolute;left:872px;top:230px;width:320px}
  .word .t{font-family:var(--serif);font-weight:500;font-size:96px;
    line-height:.94;letter-spacing:-.02em;color:var(--ink)}
  .word .t .a{color:var(--spark)}
  .word .s{margin-top:20px;font-family:var(--mono);font-size:20px;
    letter-spacing:.02em;color:var(--ink-soft)}
</style></head>
<body><div class="frame grid-bg">
  <div class="tab">SKILL<span class="dot">.</span>md</div>
  <div class="win">
    <div class="win-bar"><span class="dot3 r"></span><span class="dot3 y"></span><span class="dot3 g"></span><span class="win-title">superpowers/SKILL.md</span></div>
    <div class="win-body">
      <div class="fm">---</div>
      <div><span class="key">name:</span> <span class="accent">superpowers</span></div>
      <div><span class="key">description:</span> <span class="k">teach claude</span></div>
      <div><span class="key">&nbsp;&nbsp;</span><span class="k">a new trick</span></div>
      <div class="fm">---</div>
    </div>
  </div>
  <div class="word">
    <div class="t">just<br>a<br><span class="a">folder.</span></div>
    <div class="s">that's the skill</div>
  </div>
  <div class="wordmark">brutalist<span class="dot">.</span>art</div>
</div></body></html>
