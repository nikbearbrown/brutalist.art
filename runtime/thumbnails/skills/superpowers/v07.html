<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../lib/base.css">
<title>v07 — mono command token hero</title>
<style>
  /* V07 · Pure command-line identity: giant /token + block cursor. */
  .kick{position:absolute;left:90px;top:70px;
    font-family:var(--mono);font-size:19px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft)}
  .kick .slash{color:var(--spark)}
  .cmd{position:absolute;left:90px;top:250px;width:1160px;
    font-family:var(--mono);font-size:150px;letter-spacing:-.02em;color:var(--ink)}
  .cmd .slash{color:var(--spark)}
  .cmd .cur{display:inline-block;width:.52em;height:1em;background:var(--spark);
    transform:translateY(.16em);margin-left:.08em}
  .sub{position:absolute;left:96px;top:452px;font-family:var(--serif);
    font-style:italic;font-size:34px;color:var(--ink-soft)}
</style></head>
<body><div class="frame grid-bg">
  <div class="kick"><span class="slash">// </span>invoke a skill</div>
  <div class="cmd"><span class="slash">/</span>superpowers<span class="cur"></span></div>
  <div class="sub">one command. a whole new ability.</div>
  <div class="wordmark">brutalist<span class="dot">.</span>art</div>
</div></body></html>
