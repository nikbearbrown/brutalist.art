<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../lib/base.css">
<title>v09 — cream editorial poster</title>
<style>
  /* V09 · Poster furniture on cream: title + rule + handle + subline. */
  .kick{position:absolute;left:90px;top:72px;
    font-family:var(--mono);font-size:19px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft)}
  .kick .slash{color:var(--spark)}
  .poster{position:absolute;left:90px;top:206px;width:1000px}
  .poster h1{font-family:var(--serif);font-weight:500;font-size:118px;
    line-height:.98;letter-spacing:-.025em;color:var(--ink)}
  .poster h1 .p{color:var(--send)}
  .poster .rule{width:120px;height:4px;background:var(--spark);margin:44px 0 30px}
  .poster .sub{font-family:var(--sans);font-size:30px;color:var(--ink-soft);
    max-width:820px;line-height:1.32}
  .poster .sub b{color:var(--ink);font-weight:600}
</style></head>
<body><div class="frame grid-bg cream">
  <div class="kick"><span class="slash">// </span>claude code · skills</div>
  <div class="poster">
    <h1>The Superpowers<br>Skill<span class="p">.</span></h1>
    <div class="rule"></div>
    <div class="sub">How <b>one folder</b> of instructions gives Claude Code a brand-new ability.</div>
  </div>
  <div class="wordmark">brutalist<span class="dot">.</span>art</div>
</div></body></html>
